plugins { id 'com.android.application' }
android {
    namespace 'org.neardot.client'
    compileSdk 36
    defaultConfig { applicationId 'org.neardot.client'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1.0' }
    // No signing identity, automatic debug-key creation, installation, or publishing.
    buildTypes {
        debug { signingConfig = null }
        release { signingConfig = null; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
